name: Build & Release Tester APK

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_title:
        description: 'Release Title'
        required: false
        default: 'New Tester Build'
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        default: 'Automatic build with latest bug fixes and improvements.'

jobs:
  build-and-release:
    name: Build APK and Publish GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file for build
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GITHUB_REPO_OWNER=${{ github.repository_owner }}" >> .env
          echo "GITHUB_REPO_NAME=${{ github.event.repository.name }}" >> .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Keystore for Release Signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${KEYSTORE_PASSWORD:-deeptijoshi2025}" > android/key.properties
          echo "keyPassword=${KEY_PASSWORD:-deeptijoshi2025}" >> android/key.properties
          echo "keyAlias=${KEY_ALIAS:-upload}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Determine Release Tag & Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_title }}"
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            TAG="${{ github.ref_name }}"
            TITLE="Release ${{ github.ref_name }}"
            NOTES="Release ${{ github.ref_name }} is ready for testing."
          fi
          CLEAN_VERSION=$(echo "$TAG" | sed 's/^[vV]//')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "notes=$NOTES" >> $GITHUB_OUTPUT
          echo "build_name=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: flutter build apk --release --build-name=${{ steps.vars.outputs.build_name }} --build-number=${{ steps.vars.outputs.build_number }}

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          body: ${{ steps.vars.outputs.notes }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
